name: VertexPortal CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. FRONTEND CI: Lint, Build & Artifact Verification ──────────
  frontend-ci:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend Codebase
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://vertexportal.onrender.com' }}

      - name: Verify Build Output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed: dist/index.html not found!"
            exit 1
          fi
          echo "Frontend build output successfully verified."

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  # ── 2. BACKEND CI: Syntax Check, Redis Tier & Automated Tests ────
  backend-ci:
    name: Backend Syntax & Test Suite (with Redis Tier)
    runs-on: ubuntu-latest

    # Ephemeral Redis service container for live L2 caching & test validation
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      PORT: 4000
      MONGO_URI: mongodb://127.0.0.1:27017/test_vertex_db
      API_URL: http://127.0.0.1:4000
      FRONTEND_URL: http://localhost:5173
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_pipeline_jwt_secret_token_123456789_abcdef
      JWT_EXPIRES_IN: 7d
      AUTO_VERIFY_EMAIL: "true"
      DISABLE_EMAIL_VERIFY: "false"
      RESEND_API_KEY: re_ci_mock_test_key_123456
      EMAIL_FROM: "Vertex LMS <ci@vertexportal.com>"
      IMAGEKIT_PUBLIC_KEY: ci_mock_public_key
      IMAGEKIT_PRIVATE_KEY: ci_mock_private_key
      IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci_mock
      RAZORPAY_KEY_ID: rzp_test_mock
      RAZORPAY_SECRET_ID: rzp_test_mock_secret
      MISTRAL_API_KEY: mistral_test_mock_key
      STREAM_API_KEY: stream_test_mock_key
      STREAM_API_SECRET: stream_test_mock_secret

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        run: |
          node -c server.js
          node -c src/app.js

      - name: Test Redis Connection & Cache Operations
        run: npm run test:redis

      - name: Run Backend Automated Test Suites (Circuit Breaker & SSR Cache)
        run: npm test

  # ── 3. SECURITY AUDIT: High-Severity Dependency Scan ─────────────
  security-audit:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ── 4. CI STATUS GATE: Unified Branch Protection Check ───────────
  ci-status-gate:
    name: CI Pipeline Status Check
    needs: [frontend-ci, backend-ci, security-audit]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Evaluate Pipeline Health
        run: |
          if [ "${{ needs.frontend-ci.result }}" != "success" ] || [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "::error::One or more critical CI jobs failed!"
            exit 1
          fi
          echo "All critical CI checks passed successfully! Ready for deployment."
